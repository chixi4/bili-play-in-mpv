# bili_live_danmaku 脚本配置
# 这个文件是弹幕工具的主配置入口

# 开关
enabled=yes
show_user=no
force_room_id=

# 直播拉取
poll_interval=1.0

# 样式与密度
font_size=34
max_lines=14
duration=14.0
# 水平轨道宽度比例，1.0 是全屏，越小越集中到左侧
horizontal_span_ratio=0.90
area_ratio=0.45
margin_top=24
line_gap=8
item_margin=16

# 轨道调度
# top_stack_ratio 越小越偏向顶部轨道堆积
top_stack_ratio=0.24
# top_lane_bias 越大越优先高位轨道
top_lane_bias=8.0

# 拥塞控制
# merge_tolerance 大于 0 时会在时间窗口内合并同文案
merge_tolerance=0
# max_screen_danmaku 大于 0 时限制屏上最大弹幕数
max_screen_danmaku=0

# 点播 seek 与预填充
video_seek_reset_threshold=0.70
video_prefill_extra=1.20
video_prefill_max=260
# 开场预填充时确保至少已经可见这么长时间
video_prefill_min_elapsed=0.80
# 开场预填充提前量，值越大越容易一开始就看见弹幕
video_prefill_startup_advance=1.60
# 开场预填充最小推进比例，0.25 约等于已走完 25% 轨迹
video_prefill_min_progress=0.50
# 每帧从点播原始弹幕序列取出的上限，避免单帧瞬时挤爆
video_emit_batch=56
# 当脚本落后于视频时间时，允许自动提高每帧上限追赶
video_emit_batch_max=220
video_emit_lag_step=0.08
video_emit_lag_boost=18
# 点播拥塞时的重试队列，避免弹幕被直接丢弃
video_retry_window=4.5
video_retry_max=600
# 重试总上限
video_retry_batch=180
# 重试每帧扫描上限，配合总上限做削峰
video_retry_tick_batch=56
video_retry_step=0.05
# 点播开场短暂停住，等弹幕准备完自动继续
video_startup_hold=no
video_startup_hold_timeout=4.0

# 性能日志
perf_log=yes
perf_log_interval=5.0
perf_slow_ms=8.0
perf_log_to_file=yes
